# Render.com Blueprint -- defines BOTH services so the whole stack deploys
# from one git push. Walk through the activation steps in DEPLOY.md.
#
# Render free tier notes:
#   * Web services sleep after 15 minutes of no traffic and cold-start in
#     ~30-60 seconds. That is fine for a portfolio/demo.
#   * MongoDB is NOT included here -- you'll use the free MongoDB Atlas
#     cluster and paste its connection string into MONGODB_URI.

services:
  # =========================================================
  # 1. The Python AI service (FastAPI). Publicly reachable but
  #    gated by AI_SERVICE_TOKEN so only Donato can call it.
  # =========================================================
  - type: web
    name: donato-ai
    runtime: docker
    plan: free
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AI_SERVICE_PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false          # paste your Groq key in the Render dashboard
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: AI_SERVICE_TOKEN
        generateValue: true  # Render generates a strong random value
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma   # ephemeral on free tier (re-indexed at boot, ~3s)
      - key: DISABLE_CPP_EXT
        value: "false"

  # =========================================================
  # 2. The Node web app (Donato). Publicly reachable.
  # =========================================================
  - type: web
    name: donato-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false          # optional: app falls back to RENDER_EXTERNAL_URL (auto-injected by Render). Override only if you have a custom domain.
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false          # paste your MongoDB Atlas connection string here
      - key: AI_SERVICE_URL
        fromService:         # auto-fills with donato-ai's public URL (e.g. https://donato-ai-xxxx.onrender.com) — no manual paste needed
          type: web
          name: donato-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: donato-ai
          envVarKey: AI_SERVICE_TOKEN

      # --- Optional: SMTP for email verification + password reset ---
      # Leave empty to disable email entirely; the app will skip those flows
      # gracefully and signup still works (just no verification email).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SITE_CONTACT_EMAIL
        sync: false

      # --- Optional: Google OAuth ---
      # Set both to enable the "Continue with Google" button on login/signup.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
